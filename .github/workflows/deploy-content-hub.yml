name: Deploy Content Automation Hub

on:
  push:
    branches: [main]
    paths:
      - "sistem-agen/cloudflare-worker/**"
      - ".github/workflows/deploy-content-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistem-agen/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sistem-agen/cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Validate Worker
        run: npm run check
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply content-automation-hub-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    # A missing API token intentionally skips deployment; CI remains independent.
