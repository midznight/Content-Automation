name: Deploy Content Automation Hub

on:
  push:
    branches: [main]
    paths:
      - "sistem-agen/cloudflare-worker/**"
      - ".github/workflows/deploy-content-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistem-agen/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2c49f9900ee9ae01bedd6acf58178e9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Worker
        run: npm run check
      - name: Apply D1 migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply content-automation-hub-prod --remote
      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
      - name: Deployment skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Set GitHub Actions secret CLOUDFLARE_API_TOKEN to enable automatic production deployment."
