name: Content Automation Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-automation-production-e2e
  cancel-in-progress: false

jobs:
  production-e2e:
    name: Isolated production API and MCP verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d2c49f9900ee9ae01bedd6acf58178e9
      CLOUDFLARE_D1_DATABASE_ID: d80ecae4-6171-4526-a289-e6c138b5a9c4
      CONTENT_HUB_URL: https://content-automation-hub.midzpribadi.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate E2E script syntax
        run: node --check sistem-agen/scripts/production-e2e.mjs
      - name: Run isolated production E2E test
        run: node sistem-agen/scripts/production-e2e.mjs
