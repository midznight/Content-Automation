name: Automation-Content CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "sistem-agen/**"
      - ".github/workflows/content-hub.yml"
      - ".github/workflows/production-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "sistem-agen/**"
      - ".github/workflows/content-hub.yml"
      - ".github/workflows/production-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-content-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        working-directory: sistem-agen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        working-directory: sistem-agen
        run: pytest -q

      - name: Run Ruff checks
        working-directory: sistem-agen
        run: |
          ruff check .
          ruff format --check .

  validate-cloudflare:
    name: Cloudflare Worker tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sistem-agen/cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sistem-agen/cloudflare-worker/package.json

      - name: Install Cloudflare Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run permission tests and type checks
        run: npm run check

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run