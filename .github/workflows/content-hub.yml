name: Automation-Content CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "sistem-agen/**"
      - ".github/workflows/content-hub.yml"
  pull_request:
    branches: [main]
    paths:
      - "sistem-agen/**"
      - ".github/workflows/content-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-content-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Python tests, lint, and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        working-directory: sistem-agen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        working-directory: sistem-agen
        run: pytest -q

      - name: Run Ruff checks
        working-directory: sistem-agen
        run: |
          ruff check .
          ruff format --check .

      - name: Validate Compose and build the optional container image
        working-directory: sistem-agen
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build --pull hub

      - name: Run container and database migration smoke test
        working-directory: sistem-agen
        run: |
          docker compose up -d hub
          for attempt in $(seq 1 30); do
            if docker compose exec -T hub python -c 'import json, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3); body = json.load(response); assert body["status"] == "ok", body'; then
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 hub
          docker compose down
          exit 1
