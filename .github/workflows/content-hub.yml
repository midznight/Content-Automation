name: Automation-Content CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "sistem-agen/**"
      - ".github/workflows/content-hub.yml"
  pull_request:
    branches: [main]
    paths:
      - "sistem-agen/**"
      - ".github/workflows/content-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-content-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        working-directory: sistem-agen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        working-directory: sistem-agen
        run: pytest -q

      - name: Run Ruff checks
        working-directory: sistem-agen
        run: |
          ruff check .
          ruff format --check .

