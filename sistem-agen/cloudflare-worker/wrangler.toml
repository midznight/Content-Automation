name = "content-automation-hub"
main = "src/index.ts"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "content-automation-hub-prod"
database_id = "d80ecae4-6171-4526-a289-e6c138b5a9c4"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "content-automation-artifacts-prod"

[triggers]
crons = ["*/15 * * * *", "0 2 * * *"]
