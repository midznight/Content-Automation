name: automation-content-hub

services:
  hub:
    container_name: automation-content-hub
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/hub.db
    volumes:
      - ./data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - content-hub

  caddy:
    container_name: automation-content-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in sistem-agen/.env}
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - content-hub

networks:
  content-hub:

volumes:
  caddy_data:
  caddy_config:
